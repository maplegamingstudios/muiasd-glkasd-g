name: CI

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download and Install AnyDesk
      shell: powershell
      run: |
        # Download the AnyDesk executable directly to a stable root folder
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "C:\AnyDesk.exe"
        
        # Explicit installation path mapping for GitHub Virtual Environments
        $installFolder = "C:\Program Files (x86)\AnyDesk"
        New-Item -ItemType Directory -Force -Path $installFolder
        
        # Trigger deployment tracking and wait until the system updates dependencies
        Start-Process -FilePath "C:\AnyDesk.exe" -ArgumentList "--install `"$installFolder`" --start-with-win --silent" -NoNewWindow -Wait
        Start-Sleep -Seconds 15

    - name: Configure Unattended Access Password
      shell: powershell
      run: |
        # Force navigation to execution folder and inject password configuration
        cd "C:\Program Files (x86)\AnyDesk"
        echo "YourSecurePassword123!" | .\AnyDesk.exe --set-password

    - name: Display AnyDesk ID and Keep Alive
      shell: powershell
      run: |
        cd "C:\Program Files (x86)\AnyDesk"
        Start-Sleep -Seconds 10
        
        # Pull ID output directly from configuration system files
        $anydesk_id = Get-Content "$env:programdata\AnyDesk\system.conf" | Select-String "ad.anydesk.id="
        Write-Host "=========================================="
        Write-Host "YOUR ANYDESK ID IS: $anydesk_id"
        Write-Host "=========================================="
        
        # Run execution loop to bypass immediate automated runner shutdown
        $timeout = New-TimeSpan -Hours 6
        $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
        while ($stopwatch.Elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
            Write-Host "Keep-alive: Machine is active..."
        }
