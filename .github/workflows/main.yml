name: Windows VPS with AnyDesk

on: 
  workflow_dispatch: # Allows you to trigger the VPS manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 # 6-hour maximum limit per GitHub runner

    steps:
    - name: Download and Install AnyDesk
      shell: powershell
      run: |
        # Download the AnyDesk executable
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
        
        # Install AnyDesk silently
        Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--install `"$env:ProgramFiles(x86)\AnyDesk`" --with-remove --silent" -Wait

    - name: Configure Unattended Access Password
      shell: powershell
      run: |
        # Set your desired unattended access password here (Replace 'YourSecurePassword123!')
        # Note: In a real scenario, AnyDesk requires an encrypted hash or a complex setup via the service registry.
        # This echoes the password to the AnyDesk service to try and force unattended access configuration.
        cd "C:\Program Files (x86)\AnyDesk"
        echo "YourSecurePassword123!" | .\AnyDesk.exe --set-password

    - name: Display AnyDesk ID and Keep Alive
      shell: powershell
      run: |
        cd "C:\Program Files (x86)\AnyDesk"
        
        # Pull the generated AnyDesk ID from the service file
        Start-Sleep -Seconds 10
        $anydesk_id = Get-Content "$env:programdata\AnyDesk\system.conf" | Select-String "ad.anydesk.id="
        Write-Host "=========================================="
        Write-Host "YOUR ANYDESK ID IS: $anydesk_id"
        Write-Host "=========================================="
        
        # Loop endlessly to prevent the GitHub action from completing and closing the session
        # This will run until it hits GitHub's hard 6-hour timeout limit
        $timeout = New-TimeSpan -Hours 6
        $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
        while ($stopwatch.Elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
            Write-Host "Keep-alive: Machine is still running..."
        }
