name: AnyDesk Remote Desktop

on: 
  workflow_dispatch:

jobs:
  anydesk-connect:
    runs-on: windows-latest
    
    steps:
    - name: Download AnyDesk
      run: |
        echo "Downloading AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"

    - name: Install and Start AnyDesk Service
      run: |
        echo "Installing AnyDesk as a background service..."
        # Running the official install command helps register the ID properly
        Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--install", "C:\Program Files (x86)\AnyDesk", "--silent" -Wait
        
        echo "Setting unattended access password..."
        echo "YourSecurePassword123!" | & "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
        
        echo "Ensuring service is running..."
        Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 5

    - name: Retrieve and Verify AnyDesk ID
      shell: powershell
      run: |
        echo "Retrieving AnyDesk ID (waiting for registration)..."
        $anydesk_path = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
        $id = ""
        $attempts = 0
        $max_attempts = 6
        
        # Loop up to 6 times (30 seconds) to allow AnyDesk to generate the ID
        while ([string]::IsNullOrWhiteSpace($id) -and $attempts -lt $max_attempts) {
            Start-Sleep -Seconds 5
            $id = & $anydesk_path --get-id
            $id = $id.Trim()
            $attempts++
            echo "Attempt $attempts: Retrieved ID -> '$id'"
        }
        
        # CRITICAL CHECK: If ID is still empty, force the GitHub Action to FAIL
        if ([string]::IsNullOrWhiteSpace($id)) {
            Write-Error "CRITICAL ERROR: AnyDesk ID could not be generated! Failing the build."
            exit 1
        }
        
        echo "============================================="
        echo " YOUR ANYDESK ID IS: $id"
        echo " PASSWORD IS: YourSecurePassword123!"
        echo "============================================="

    - name: Keep Runner Alive
      run: |
        echo "Keep-alive active. Connect now!"
        $timeout = 21600 
        while ($timeout -gt 0) {
            Start-Sleep -Seconds 10
            $timeout -= 10
        }
