name: AnyDesk Remote Desktop

on: 
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  anydesk-connect:
    runs-on: windows-latest
    
    steps:
    - name: Download AnyDesk
      run: |
        echo "Downloading AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"

    - name: Set AnyDesk Password and Start Service
      run: |
        echo "Setting unattended access password..."
        # Replace 'YourSecurePassword123!' with a password of your choice
        echo "YourSecurePassword123!" | .\AnyDesk.exe --set-password
        
        echo "Starting AnyDesk..."
        Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--start-service" -WindowStyle Hidden
        Start-Sleep -Seconds 5

    - name: Retrieve and Display AnyDesk ID
      run: |
        echo "Retrieving AnyDesk ID..."
        $anydesk_id = .\AnyDesk.exe --get-id
        
        echo "============================================="
        echo " YOUR ANYDESK ID IS: $anydesk_id"
        echo " PASSWORD IS: YourSecurePassword123!"
        echo "============================================="

    - name: Keep Runner Alive
      run: |
        echo "Keep-alive active. Connect now! The runner will stay open for up to 6 hours or until manually cancelled."
        # Loops for ~6 hours (21600 seconds) to keep the runner from closing
        $timeout = 21600 
        while ($timeout -gt 0) {
            Start-Sleep -Seconds 10
            $timeout -= 10
        }
