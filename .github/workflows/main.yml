name: Remote Desktop via AnyDesk

on: 
  workflow_dispatch: 

jobs:
  anydesk-connect:
    runs-on: windows-latest
    steps:
      - name: Download and Setup AnyDesk Standalone
        shell: powershell
        run: |
          echo "Creating AnyDesk directory..."
          New-Item -ItemType Directory -Force -Path "C:\AnyDesk"
          
          echo "Downloading AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "C:\AnyDesk\anydesk.exe"

      - name: Configure Unattended Access Password
        shell: powershell
        run: |
          cd "C:\AnyDesk"
          
          echo "Setting up unattended access password..."
          # Change 'YourSecurePassword123!' to your desired password
          echo "YourSecurePassword123!" | .\anydesk.exe --set-password

      - name: Retrieve AnyDesk ID
        shell: powershell
        run: |
          # Give the background process a brief moment to initialize
          Start-Sleep -Seconds 5
          
          cd "C:\AnyDesk"
          
          echo "Retrieving your AnyDesk Address ID..."
          $anydeskId = .\anydesk.exe --get-id | Out-String
          
          echo "--------------------------------------------------------"
          echo "YOUR ANYDESK ID IS: $anydeskId"
          echo "--------------------------------------------------------"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          echo "Runner is live. Connect using the ID displayed above."
          echo "This step keeps the session open for 1 hour (3600 seconds)."
          Start-Sleep -Seconds 3600
