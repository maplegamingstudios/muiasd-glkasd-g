name: Remote Desktop via AnyDesk

on: 
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  anydesk-connect:
    runs-on: windows-latest
    steps:
      - name: Download and Install AnyDesk
        shell: powershell
        run: |
          echo "Downloading AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
          
          echo "Installing AnyDesk as a background service..."
          Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--install", "C:\Program Files (x86)\AnyDesk", "--start-with-win", "--silent" -Wait

      - name: Configure Unattended Access Password
        shell: powershell
        run: |
          echo "Navigating to AnyDesk folder..."
          cd "C:\Program Files (x86)\AnyDesk"
          
          # Sets the unattended password. Change 'YourSecurePassword123!' to your preference.
          echo "Setting up unattended access password..."
          echo "YourSecurePassword123!" | .\anydesk.exe --set-password

      - name: Retrieve AnyDesk ID
        shell: powershell
        run: |
          # Wait a few seconds for the background service to assign an ID
          Start-Sleep -Seconds 5
          
          echo "Navigating to AnyDesk folder..."
          cd "C:\Program Files (x86)\AnyDesk"
          
          echo "Retrieving your AnyDesk Address ID..."
          $anydeskId = .\anydesk.exe --get-id | Out-String
          
          echo "--------------------------------------------------------"
          echo "YOUR ANYDESK ID IS: $anydeskId"
          echo "--------------------------------------------------------"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          echo "Runner is live. Connect using the ID displayed above."
          echo "This step keeps the session open for 1 hour (3600 seconds)."
          Start-Sleep -Seconds 3600
