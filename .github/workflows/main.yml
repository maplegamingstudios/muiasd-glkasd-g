name: AnyDesk Remote Desktop

on: 
  workflow_dispatch:

jobs:
  anydesk-connect:
    runs-on: windows-latest
    
    steps:
    - name: Download AnyDesk
      run: |
        echo "Downloading AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"

    - name: Explicit Install and Dynamic Path Discovery
      id: find_path
      shell: powershell
      run: |
        echo "Installing AnyDesk to Program Files silently..."
        $installProcess = Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--install", "C:\Program Files (x86)\AnyDesk", "--silent" -PassThru -Wait
        
        echo "Ensuring service is running..."
        Get-Service -Name "AnyDesk" -ErrorAction Stop | Set-Service -Status Running
        
        echo "Dynamically discovering AnyDesk executable path..."
        # This pulls the exact path Windows is using to run the background service
        $svcPath = (Get-CimInstance Win32_Service -Filter "Name='AnyDesk'").PathName
        
        # Clean up quotes or extra parameters from the service path string
        if ($svcPath -match '"([^"]+)"') { $resolvedPath = $matches[1] } else { $resolvedPath = $svcPath }
        echo "Resolved AnyDesk Path: $resolvedPath"
        
        # Save the discovered path into the GitHub environment variable for the next steps
        echo "ANYDESK_EXE_PATH=$resolvedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Set Password
      shell: powershell
      run: |
        echo "Setting unattended access password using path: ${{ env.ANYDESK_EXE_PATH }}"
        echo "YourSecurePassword123!" | & "${{ env.ANYDESK_EXE_PATH }}" --set-password
        Start-Sleep -Seconds 5

    - name: Retrieve and Verify AnyDesk ID
      shell: powershell
      run: |
        echo "Checking AnyDesk local status..."
        & "${{ env.ANYDESK_EXE_PATH }}" --get-status
        
        echo "Retrieving AnyDesk ID (waiting for network registration)..."
        $id = ""
        $attempts = 0
        $max_attempts = 10
        
        while ([string]::IsNullOrWhiteSpace($id) -and $attempts -lt $max_attempts) {
            Start-Sleep -Seconds 5
            $id = & "${{ env.ANYDESK_EXE_PATH }}" --get-id | Out-String
            if ($id) { $id = $id.Trim() }
            $attempts++
            echo "Attempt ${attempts} - Retrieved ID -> '$id'"
        }
        
        if ([string]::IsNullOrWhiteSpace($id)) {
            echo "===================== DEBUG ENGINE LOGS ====================="
            if (Test-Path "$env:ProgramData\AnyDesk\ad_svc.log") {
                Get-Content "$env:ProgramData\AnyDesk\ad_svc.log" -Tail 50
            } else {
                echo "AnyDesk service log file not found."
            }
            echo "============================================================="
            Write-Error "CRITICAL ERROR: AnyDesk ID is empty! Check the debug logs above."
            exit 1
        }
        
        echo "============================================="
        echo " YOUR ANYDESK ID IS: $id"
        echo " PASSWORD IS: YourSecurePassword123!"
        echo "============================================="

    - name: Keep Runner Alive
      run: |
        echo "Keep-alive active. Connect now!"
        $timeout = 21600 
        while ($timeout -gt 0) {
            Start-Sleep -Seconds 10
            $timeout -= 10
        }
