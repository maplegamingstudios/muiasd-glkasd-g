name: Remote Desktop via AnyDesk

on: 
  workflow_dispatch: 

jobs:
  anydesk-connect:
    runs-on: windows-latest
    steps:
      - name: 1. Download and Setup AnyDesk
        shell: powershell
        run: |
          Write-Host "=== CREATING DIRECTORY ==="
          New-Item -ItemType Directory -Force -Path "C:\AnyDesk"
          
          Write-Host "=== DOWNLOADING ANYDESK ==="
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "C:\AnyDesk\anydesk.exe" -Verbose
          
          Write-Host "=== VERIFYING DOWNLOAD ==="
          Get-ChildItem "C:\AnyDesk"

      - name: 2. Start AnyDesk Service & Set Password
        shell: powershell
        run: |
          cd "C:\AnyDesk"
          
          Write-Host "=== STARTING ANYDESK BACKGROUND PROCESS ==="
          # Start-Process launches it in the background so it stays alive
          Start-Process -FilePath ".\anydesk.exe" -PassThru
          
          Write-Host "=== WAITING FOR INITIALIZATION ==="
          Start-Sleep -Seconds 7
          
          Write-Host "=== CONFIGURING UNATTENDED ACCESS PASSWORD ==="
          # Explicitly piping the password into the running process instance
          echo "YourSecurePassword123!" | .\anydesk.exe --set-password
          
          Write-Host "=== CHECKING RUNNING PROCESSES ==="
          Get-Process -Name "anydesk" -ErrorAction SilentlyContinue

      - name: 3. Retrieve AnyDesk ID
        shell: powershell
        run: |
          cd "C:\AnyDesk"
          
          Write-Host "=== FETCHING ID (RAW OUTPUT) ==="
          # Capturing and printing directly to console
          $anydeskId = .\anydesk.exe --get-id
          
          Write-Host "--------------------------------------------------------"
          Write-Host "YOUR ANYDESK ID IS: $anydeskId"
          Write-Host "--------------------------------------------------------"
          
          # If it still fails, check the configuration file text directly
          if ($anydeskId -match "SERVICE_NOT_RUNNING") {
              Write-Host "=== DEBUG: Dumping Service Logs ==="
              Get-Content "$env:USERPROFILE\AppData\Roaming\AnyDesk\system.conf" -ErrorAction SilentlyContinue | Select-String "ad.roster.id"
          }

      - name: 4. Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "=== RUNNER LIVE ==="
          Write-Host "Connect using the ID displayed above."
          Write-Host "This step keeps the session open for 1 hour (3600 seconds)."
          Start-Sleep -Seconds 3600
